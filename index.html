<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" id="theme-colour" content="#E1E8D2" />
    <!-- Installable: the manifest is swapped per surface (menu/kiosk/kds/pos) at runtime so each installs as its own app. -->
    <link rel="manifest" id="app-manifest" href="/manifest-menu.webmanifest" />
    <link rel="apple-touch-icon" id="app-touch-icon" href="/icon-menu-192.png" />
    <meta name="apple-mobile-web-app-title" id="app-title" content="Menu" />
    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, "");
        // The tablet menu is the default surface and gets its own manifest.
        // Until now it fell through to the kiosk one, whose start_url is
        // /kiosk — so installing the menu to a home screen produced the kiosk
        // app, which opens the licensed surface and asks to be activated.
        //
        // Each surface also gets its own icon and home-screen name. Four apps
        // wearing one icon is how a tablet ends up on the wrong one: staff
        // pick by the picture, not by reading the label.
        var S = {
          "/kds":   { m: "/manifest-kds.webmanifest",  i: "kds",   t: "KDS",   c: "#1F2937" },
          "/pos":   { m: "/manifest-pos.webmanifest",  i: "till",  t: "Till",  c: "#5E7A4D" },
          "/kiosk": { m: "/manifest.webmanifest",      i: "kiosk", t: "Kiosk", c: "#844429" },
        };
        var s = S[p] || { m: "/manifest-menu.webmanifest", i: "menu", t: "Menu", c: "#F4E9DD" };
        var set = function (id, attr, val) {
          var el = document.getElementById(id);
          if (el) el.setAttribute(attr, val);
        };
        set("app-manifest", "href", s.m);
        // iOS ignores the manifest for home-screen installs and reads these
        // two instead, so an iPad would otherwise land on the generic icon
        // and the page title.
        set("app-touch-icon", "href", "/icon-" + s.i + "-192.png");
        set("app-title", "content", s.t);
        set("theme-colour", "content", s.c);
      })();
    </script>
    <!-- iOS Smart App Banner: Safari shows a native "Open / View in App Store" strip on phones.
         Fill in the numeric App Store ID once the app is listed, then remove the comment markers.
         app-argument passes the scanned table link through to the app.
    <meta name="apple-itunes-app" content="app-id=REPLACE_APP_STORE_ID, app-argument=https://chocoberry-menu.vercel.app/" />
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>still. — Order Ahead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins/Hanken Grotesk: still. and Chocoberry. Sora/Jost: Tove's brand pair
         (see --font-head / --font-body in THEMES). -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- Kiosk welcome tiles. Subsetted to the two glyphs we use (icon_names),
         so this is a few KB rather than the whole icon font. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=brunch_dining,shopping_bag&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body { background: #E1E8D2; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
