<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#E1E8D2" />
    <!-- Installable: the manifest is swapped per surface (kiosk/kds/pos) at runtime so each installs as its own app. -->
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, "");
        var m = p === "/kds" ? "/manifest-kds.webmanifest" : p === "/pos" ? "/manifest-pos.webmanifest" : "/manifest.webmanifest";
        var el = document.getElementById("app-manifest");
        if (el) el.setAttribute("href", m);
      })();
    </script>
    <!-- iOS Smart App Banner: Safari shows a native "Open / View in App Store" strip on phones.
         Fill in the numeric App Store ID once the app is listed, then remove the comment markers.
         app-argument passes the scanned table link through to the app.
    <meta name="apple-itunes-app" content="app-id=REPLACE_APP_STORE_ID, app-argument=https://chocoberry-menu.vercel.app/" />
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>still. — Order Ahead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Kiosk welcome tiles. Subsetted to the two glyphs we use (icon_names),
         so this is a few KB rather than the whole icon font. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=brunch_dining,shopping_bag&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body { background: #E1E8D2; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
